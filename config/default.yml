Asjer/ExplicitMigrationVersionInSpec:
  Description: Requires migration specs to run migrations to an explicit version.
  Enabled: true
  VersionAdded: "0.5.0"
  Include:
    - 'spec/migrations/**/*_spec.rb'

Asjer/MigrationSchemaOnly:
  Description: Allows only schema statements in Rails migrations; move data changes and raw SQL to a maintenance task.
  Enabled: true
  VersionAdded: "0.5.0"
  Include:
    - 'db/migrate/**/*.rb'
  # Version of the last existing migration; earlier migrations are not checked.
  StartAfter: ~
  AllowedMethods:
    - create_table
    - create_join_table
    - change_table
    - rename_table
    - drop_table
    - drop_join_table
    - add_column
    - remove_column
    - remove_columns
    - rename_column
    - change_column
    - change_column_default
    - change_column_null
    - change_column_comment
    - change_table_comment
    - add_timestamps
    - remove_timestamps
    - add_index
    - remove_index
    - rename_index
    - add_reference
    - remove_reference
    - add_belongs_to
    - remove_belongs_to
    - add_foreign_key
    - remove_foreign_key
    - add_check_constraint
    - remove_check_constraint
    - validate_check_constraint
    - validate_foreign_key
    - validate_constraint
    - add_exclusion_constraint
    - remove_exclusion_constraint
    - add_unique_constraint
    - remove_unique_constraint
    - enable_extension
    - disable_extension
    - create_enum
    - drop_enum
    - rename_enum
    - add_enum_value
    - rename_enum_value
    - create_schema
    - drop_schema
    - create_virtual_table
    - drop_virtual_table
    - table_exists?
    - column_exists?
    - index_exists?
    - index_name_exists?
    - foreign_key_exists?
    - check_constraint_exists?
    - extension_enabled?
    - view_exists?
    - reversible
    - revert
    - up_only
    - say
    - say_with_time
    - suppress_messages
    - disable_ddl_transaction!
    - raise
    - private
  AllowedConstants:
    - ActiveRecord::IrreversibleMigration
    - Rails

Asjer/NoDefaultTranslation:
  Description: Checks for use of the `default:` option in translation calls.
  Enabled: true
  VersionAdded: "0.1.0"

Asjer/RailsClassOrder:
  Description: Enforces consistent ordering of declarative methods in Rails models.
  Enabled: true
  VersionAdded: "0.4.0"
  Include:
    - 'app/models/**/*.rb'
  Scopes:
    - default_scope
    - scope
  Attributes:
    - attr_accessor
    - attr_reader
    - attr_writer
    - attr_readonly
    - attribute
    - serialize
    - store
    - store_accessor
  Enums:
    - enum
  Associations:
    - belongs_to
    - has_one
    - has_many
    - has_and_belongs_to_many
    - has_one_attached
    - has_many_attached
  Validations:
    - validates
    - validates_acceptance_of
    - validates_associated
    - validates_comparison_of
    - validates_confirmation_of
    - validates_each
    - validates_exclusion_of
    - validates_format_of
    - validates_inclusion_of
    - validates_length_of
    - validates_size_of
    - validates_numericality_of
    - validates_presence_of
    - validates_uniqueness_of
    - validates_with
    - validate
  Callbacks:
    - after_initialize
    - after_find
    - after_touch
    - before_validation
    - after_validation
    - before_save
    - around_save
    - before_create
    - around_create
    - after_create
    - before_update
    - around_update
    - after_update
    - after_save
    - before_destroy
    - around_destroy
    - after_destroy
    - before_commit
    - after_commit
    - after_rollback
    - after_save_commit
    - after_create_commit
    - after_update_commit
    - after_destroy_commit
  Others:
    - encrypts
    - normalizes
    - delegate
    - delegate_missing_to
    - accepts_nested_attributes_for
    - has_secure_password
    - has_secure_token
    - generates_token_for
    - composed_of

Asjer/SystemSpecLoginAs:
  Description: Requires system specs to use a helper that signs in and visits together instead of a bare Warden handoff.
  Enabled: pending
  VersionAdded: "0.6.0"
  Include:
    - 'spec/system/**/*.rb'
  MethodNames:
    - login_as
  PreferredHelper: sign_in_and_visit
