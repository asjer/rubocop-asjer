Asjer/NoDefaultTranslation:
  Description: Checks for use of the `default:` option in translation calls.
  Enabled: true
  VersionAdded: "0.1.0"

Asjer/RailsClassOrder:
  Description: Enforces consistent ordering of declarative methods in Rails models.
  Enabled: true
  VersionAdded: "0.4.0"
  Include:
    - 'app/models/**/*.rb'
  Scopes:
    - default_scope
    - scope
  Attributes:
    - attr_accessor
    - attr_reader
    - attr_writer
    - attr_readonly
    - attribute
    - serialize
    - store
    - store_accessor
  Enums:
    - enum
  Associations:
    - belongs_to
    - has_one
    - has_many
    - has_and_belongs_to_many
    - has_one_attached
    - has_many_attached
  Validations:
    - validates
    - validates_acceptance_of
    - validates_associated
    - validates_comparison_of
    - validates_confirmation_of
    - validates_each
    - validates_exclusion_of
    - validates_format_of
    - validates_inclusion_of
    - validates_length_of
    - validates_size_of
    - validates_numericality_of
    - validates_presence_of
    - validates_uniqueness_of
    - validates_with
    - validate
  Callbacks:
    - after_initialize
    - after_find
    - after_touch
    - before_validation
    - after_validation
    - before_save
    - around_save
    - before_create
    - around_create
    - after_create
    - before_update
    - around_update
    - after_update
    - after_save
    - before_destroy
    - around_destroy
    - after_destroy
    - before_commit
    - after_commit
    - after_rollback
    - after_save_commit
    - after_create_commit
    - after_update_commit
    - after_destroy_commit
  Others:
    - encrypts
    - normalizes
    - delegate
    - delegate_missing_to
    - accepts_nested_attributes_for
    - has_secure_password
    - has_secure_token
    - generates_token_for
    - composed_of
